name: Compilar .dylib (macOS)

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Baixar arquivos do repositório
        uses: actions/checkout@v4

      - name: Compilar .dylib
        run: |
          # Pega todos os arquivos .cpp e .mm automaticamente
          FILES=$(find . -name "*.cpp" -o -name "*.mm" | grep -v ".github" | tr '\n' ' ')
          echo "Arquivos encontrados: $FILES"

          clang++ \
            -shared \
            -fPIC \
            -framework Foundation \
            -framework UIKit \
            -std=c++17 \
            -O2 \
            $FILES \
            -o minha_lib.dylib

          echo "✅ Compilado com sucesso!"
          ls -lh minha_lib.dylib

      - name: Fazer upload do .dylib
        uses: actions/upload-artifact@v4
        with:
          name: minha_lib_dylib
          path: minha_lib.dylib
